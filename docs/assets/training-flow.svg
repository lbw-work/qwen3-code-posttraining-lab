<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="flow-title flow-desc" font-family="Arial, Helvetica, sans-serif">
<title id="flow-title">Training branches and unified evaluation</title>
<desc id="flow-desc">Base branches into Full SFT and LoRA SFT. DPO, PPO and GRPO start from the same LoRA SFT. A separate reward model trained from Base scores PPO. All six stages use the same frozen evaluation.</desc>
