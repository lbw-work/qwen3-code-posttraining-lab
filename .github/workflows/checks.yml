name: Project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-and-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install CPU dependencies and editable package
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Compile and test
        run: |
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
          python scripts/check_project.py
      - name: Verify isolated code rewards
        run: |
          docker build -t qwen-code-eval:0.3.1 -f Dockerfile.eval .
          PYTHONPATH=scripts python - <<'PY'
          from code_reward import score_batch
          answers = ['def f(x): return x + 1', 'def f(x): return 0', 'def f(:', 'def f(x):\n    while True: pass']
          scores = score_batch(answers, [['assert f(2) == 3']] * 4)
          assert scores == [1.0, 0.0, 0.0, 0.0], scores
          print('Docker reward probes:', scores)
          PY
